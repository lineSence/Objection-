# Пример конфигурации Objection!
# Пул моделей задаёт пользователь; его можно менять в любой момент.
# Идентификаторы моделей — в формате LiteLLM (provider/model).

# Удобнее всего настраивать в Web UI: «Настройки» (objection ui → http://127.0.0.1:6967/#/settings).
# Ключи API из Web UI хранятся отдельно, в ~/.objection/secrets.env (права 0600); из окружения тоже читаются.

models:
  - id: gpt            # короткое имя для логов и статистики
    model: openai/<your-model>
    params:            # опционально: любые параметры litellm.completion
      temperature: 0.3
  - id: claude
    model: anthropic/<your-model>
    family: anthropic  # семейство (по умолч. выводится из provider/model); судья/председатель — из другого
    fallbacks: [anthropic/<cheaper-model>]  # запасные модели при временных ошибках (429/5xx/таймаут)
  - id: gemini
    model: gemini/<your-model>
  - id: local-qwen     # локальная модель (опционально)
    model: ollama/<your-model>
    api_base: http://localhost:11434
    timeout_s: 180
    max_parallel: 1
  - id: proxy-model    # модель за LiteLLM Proxy (ключ — LITELLM_PROXY_API_KEY)
    model: litellm_proxy/<model-name-on-proxy>
    api_base: http://localhost:4000
  - id: my-server      # любой OpenAI-совместимый сервер со своим ключом
    model: openai/<model-name>
    api_base: https://llm.example.com/v1
    api_key_env: MY_SERVER_KEY
    weight: 1.5        # вес голоса в verify/quick (по умолч. 1)
    price_in: 0.5      # $ за 1M входных токенов — для бюджета, если LiteLLM не знает цену
    price_out: 1.5     # $ за 1M выходных токенов

defaults:
  mode: auto            # auto | deliberate | verify | quick (review и code включаются материалом / командой тестов)
  council:
    size: 3             # сколько моделей брать из пула (3–5 обычно достаточно)
    selection: auto     # auto (по статистике Model Registry) | pinned
    pinned: []          # например: [gpt, claude, gemini]
  judge: auto           # модель из другого семейства, чем большинство совета
  budget_usd: 0.50
  timeout_s: 120
  anonymize: true
  max_critique_rounds: 1
  preflight: true       # быстрая проверка доступности моделей перед запуском; недоступные заменяются из пула
  health_ttl_s: 300     # кэш результата проверки, сек
  retries: 2            # повторы при временных ошибках до перехода на fallbacks
  retry_backoff_s: 1.0
  respect_eval: true    # роутер учитывает последние отчёты objection eval (docs/eval.md)

verifier:                     # фактчек ответов (docs/verifier.md)
  enabled: true
  modes: [deliberate, verify]  # где проверять по умолчанию; флаг check_facts запроса главнее
  web_search: true
  searxng_url: http://localhost:8888   # в settings.yml SearXNG: search.formats: [html, json]
  search_results: 5
  python: true                # python-проверки в песочнице
  max_claims: 5
  repo: true                  # проверять утверждения о коде по файлам рабочей папки (--workdir)
  repo_results: 6
  judges: 2
  revise: true                # исправлять ответ, если утверждение опровергнуто

sandbox:                      # тесты code и python-проверки (docs/sandbox.md); не граница безопасности
  network: false
  timeout_s: 120
  memory_mb: 1024
  cpu_s: 120
  max_output_kb: 256

storage:
  path: ~/.objection/runs.sqlite
