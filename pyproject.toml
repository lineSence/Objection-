[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "objection"
version = "0.1.0.dev0"
description = "A council of LLMs that answer independently, object to each other and return one answer with honest disagreement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "lineSence" }]
dependencies = [
  "litellm>=1.50",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
objection = "objection.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/objection"]
artifacts = ["src/objection/web_dist/**"]

[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
